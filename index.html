<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">


  <title>LifeLens – Smart Daily Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="shortcut icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card" style="text-align: center;">
      <div class="brand-icon" style="margin: 0 auto 1.5rem auto; width: 64px; height: 64px; font-size: 2rem;">🎯</div>
      <h1 style="font-family: var(--font-heading); font-size: 2rem; margin-bottom: 0.5rem;">LifeLens</h1>
      <p style="color: var(--text-muted); margin-bottom: 2rem;">Plan your day. Track your progress. Improve yourself.</p>
      
      <div class="loading-spinner" style="width: 32px; height: 32px; border-width: 4px; color: var(--accent-primary);"></div>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 1rem;">Redirecting to your dashboard...</p>

      <div style="margin-top: 2rem; display: flex; gap: 1rem; justify-content: center;">
        <a href="login.html" class="btn btn-primary">Login</a>
        <a href="register.html" class="btn btn-secondary">Register</a>
      </div>
    </div>
  </div>

  <script type="module">
    import { initAuthGuard } from "./js/common.js";
    initAuthGuard((user) => {
      if (user) {
        window.location.href = "dashboard.html";
      } else {
        window.location.href = "login.html";
      }
    });
  </script>
</body>
</html>
